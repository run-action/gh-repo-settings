name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install bats
        run: |
          # yq, jq and curl are already on ubuntu-24.04; bats is not.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats

      - name: Run tests
        # Blanked so a request escaping the stub cannot authenticate.
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: bats --print-output-on-failure tests/
